name: Runtime Artifact Round Trip

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read

env:
  RUNTIME_ARTIFACT_IMAGE: node:20-bookworm@sha256:8f693eaa7e0a8e71560c9a82b55fd54c2ae920a2ba5d2cde28bac7d1c01c9ba5
  RUNTIME_ARTIFACT_PLATFORM: linux/amd64
  RUNTIME_ARTIFACT_SIGNER_WORKFLOW: .github/workflows/runtime-artifact.yml
  GH_ATTESTATION_CLI_VERSION: 2.89.0
  GH_ATTESTATION_CLI_URL: https://github.com/cli/cli/releases/download/v2.89.0/gh_2.89.0_linux_amd64.tar.gz
  GH_ATTESTATION_CLI_SHA256: d0422caade520530e76c1c558da47daebaa8e1203d6b7ff10ad7d6faba3490d8

jobs:
  build-runtime-artifact:
    name: Build SHA-bound runtime artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact workflow revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build runtime artifact in pinned Linux environment
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_WORKFLOW_PATH: .github/workflows/runtime-artifact.yml
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/runtime-artifact"
          bash ./scripts/build-runtime-artifact.sh \
            --output "$RUNNER_TEMP/runtime-artifact" \
            --image "$RUNTIME_ARTIFACT_IMAGE" \
            --platform "$RUNTIME_ARTIFACT_PLATFORM" \
            --expected-sha "$GITHUB_SHA"
          jq -e '.artifact.nonProductionEvidence == true and .identity.deployableRelease == false and .build.baseImageDigest' \
            "$RUNNER_TEMP/runtime-artifact"/*.manifest.json
          manifest="$RUNNER_TEMP/runtime-artifact/$(basename "$(find "$RUNNER_TEMP/runtime-artifact" -maxdepth 1 -name '*.manifest.json' -print -quit)")"
          {
            echo "## FB-028A runtime artifact"
            jq -r '"- Build duration: \(.build.durationMs) ms\n- Archive size: \(.measurements.archiveBytes) bytes\n- Extracted footprint: \(.measurements.extractedFootprintBytes) bytes\n- Source SHA: `\(.source.gitSha)`\n- Base image: `\(.build.baseImage)`"' "$manifest"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish development validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: runtime-artifact-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime-artifact
          if-no-files-found: error
          retention-days: 3
          include-hidden-files: true

  attest-runtime-artifact:
    name: Generate authenticated development attestation
    needs: build-runtime-artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Download built artifact into the signer job
        uses: actions/download-artifact@v4
        with:
          name: runtime-artifact-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/attestation-input

      - name: Generate GitHub-native provenance attestation
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/attestation-input/*.tar.gz

      - name: Publish attestation bundle for independent verification
        uses: actions/upload-artifact@v4
        with:
          name: runtime-artifact-attestation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 3
          include-hidden-files: true

  validate-runtime-artifact:
    name: Retrieve and validate runtime artifact
    needs: attest-runtime-artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      RUNTIME_ARTIFACT_SIGNER_REVISION: ${{ github.workflow_sha }}
    steps:
      - name: Checkout validation probe only
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download published artifact into a fresh job
        uses: actions/download-artifact@v4
        with:
          name: runtime-artifact-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/retrieved-runtime-artifact

      - name: Download authenticated attestation bundle into a fresh job
        uses: actions/download-artifact@v4
        with:
          name: runtime-artifact-attestation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/retrieved-runtime-attestation

      - name: Install pinned official GitHub CLI
        run: |
          set -euo pipefail
          install_root="$RUNNER_TEMP/gh-$GH_ATTESTATION_CLI_VERSION"
          archive="$RUNNER_TEMP/gh-$GH_ATTESTATION_CLI_VERSION.tar.gz"
          rm -rf "$install_root"
          mkdir -p "$install_root"
          curl --fail --location --silent --show-error --retry 3 "$GH_ATTESTATION_CLI_URL" --output "$archive"
          echo "$GH_ATTESTATION_CLI_SHA256  $archive" | sha256sum --check --status
          tar -xzf "$archive" --strip-components=1 --directory "$install_root"
          test -x "$install_root/bin/gh"
          echo "$install_root/bin" >> "$GITHUB_PATH"
          echo "GH_ATTESTATION_CLI=$install_root/bin/gh" >> "$GITHUB_ENV"
          "$install_root/bin/gh" version | tee "$RUNNER_TEMP/gh-version.txt"
          grep -Fq "gh version $GH_ATTESTATION_CLI_VERSION" "$RUNNER_TEMP/gh-version.txt"

      - name: Run Linux descriptor-boundary regressions
        run: python -m unittest discover -s tests -p 'test_runtime_artifact_security.py' -v

      - name: Run provenance contract regressions
        run: python -m unittest discover -s tests -p 'test_runtime_artifact_provenance.py' -v

      - name: Run trusted SSH delivery boundary regressions
        run: python -m unittest discover -s tests -p 'test_trusted_ssh_artifact_delivery.py' -v

      - name: Install disposable OpenSSH receiver for integration evidence
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends openssh-server

      - name: Prepare exact receiver identity and offline expectation
        env:
          RUNTIME_ARTIFACT_REPOSITORY_ID: ${{ github.repository_id }}
          RUNTIME_ARTIFACT_REPOSITORY_OWNER_ID: ${{ github.repository_owner_id }}
          RUNTIME_ARTIFACT_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility || 'public' }}
          RUNTIME_ARTIFACT_SIGNER_REVISION: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          archive="$(find "$RUNNER_TEMP/retrieved-runtime-artifact" -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          bundle="$(find "$RUNNER_TEMP/retrieved-runtime-attestation" -maxdepth 2 -type f -name '*.json' -print -quit)"
          test -n "$archive" -a -n "$bundle"
          selection="$(jq -c '.selection' "$RUNNER_TEMP/exact-selection.json")"
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --argjson repository_id "$RUNTIME_ARTIFACT_REPOSITORY_ID" \
            --argjson repository_owner_id "$RUNTIME_ARTIFACT_REPOSITORY_OWNER_ID" \
            --arg source_ref "$GITHUB_REF" \
            --arg source_sha "$GITHUB_SHA" \
            --arg event "$GITHUB_EVENT_NAME" \
            --arg producer_workflow "$RUNTIME_ARTIFACT_SIGNER_WORKFLOW" \
            --arg producer_revision "$RUNTIME_ARTIFACT_SIGNER_REVISION" \
            --arg signer_workflow "$RUNTIME_ARTIFACT_SIGNER_WORKFLOW" \
            --arg signer_revision "$RUNTIME_ARTIFACT_SIGNER_REVISION" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            --argjson selection "$selection" \
            --arg platform "$RUNTIME_ARTIFACT_PLATFORM" \
            --arg image "$RUNTIME_ARTIFACT_IMAGE" \
            --arg image_digest "${RUNTIME_ARTIFACT_IMAGE##*@}" \
            --arg authorization_context "ci-selection-only" \
            '{repository:$repository,repository_id:$repository_id,repository_owner_id:$repository_owner_id,source_ref:$source_ref,source_sha:$source_sha,event:$event,producer_workflow:$producer_workflow,producer_revision:$producer_revision,signer_workflow:$signer_workflow,signer_revision:$signer_revision,run_id:$run_id,run_attempt:$run_attempt,artifact_id:$selection.artifactId,artifact_name:$selection.artifactName,artifact_class:"development-runtime-evidence",artifact_service_zip_sha256:$selection.artifactServiceZipSha256,artifact_service_zip_bytes:$selection.artifactServiceZipBytes,archive_name:$selection.archiveName,archive_sha256:$selection.archiveSha256,archive_bytes:$selection.archiveBytes,platform:$platform,image:$image,image_digest:$image_digest,authorization_context:$authorization_context}' \
            > "$RUNNER_TEMP/receiver-expected-identity.json"
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg repository_id "$RUNTIME_ARTIFACT_REPOSITORY_ID" \
            --arg repository_owner_id "$RUNTIME_ARTIFACT_REPOSITORY_OWNER_ID" \
            --arg repository_visibility "$RUNTIME_ARTIFACT_REPOSITORY_VISIBILITY" \
            --arg signer_workflow "$RUNTIME_ARTIFACT_SIGNER_WORKFLOW" \
            --arg signer_revision "$RUNTIME_ARTIFACT_SIGNER_REVISION" \
            --arg source_ref "$GITHUB_REF" \
            --arg source_sha "$GITHUB_SHA" \
            --arg event "$GITHUB_EVENT_NAME" \
            --arg workflow_name "$GITHUB_WORKFLOW" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg platform "$RUNTIME_ARTIFACT_PLATFORM" \
            --arg image "$RUNTIME_ARTIFACT_IMAGE" \
            --arg image_digest "${RUNTIME_ARTIFACT_IMAGE##*@}" \
            '{repository:$repository,repository_id:$repository_id,repository_owner_id:$repository_owner_id,repository_visibility:$repository_visibility,signer_workflow:$signer_workflow,signer_revision:$signer_revision,source_ref:$source_ref,source_sha:$source_sha,event:$event,workflow_name:$workflow_name,run_id:$run_id,run_attempt:$run_attempt,platform:$platform,image:$image,image_digest:$image_digest,artifact_class:"development-runtime-evidence"}' \
            > "$RUNNER_TEMP/receiver-offline-expectation.json"
          {
            echo "CC_REAL_RECEIVER=1"
            echo "CC_RECEIVER_NETWORK_DISABLED=1"
            echo "CC_RECEIVER_REPOSITORY_ROOT=$GITHUB_WORKSPACE"
            echo "CC_RECEIVER_SERVICE_ZIP=$RUNNER_TEMP/artifact-service.zip"
            echo "CC_RECEIVER_BUNDLE=$bundle"
            echo "CC_RECEIVER_EXPECTED_IDENTITY=$RUNNER_TEMP/receiver-expected-identity.json"
            echo "CC_RECEIVER_TRUSTED_ROOT=$RUNNER_TEMP/trusted_root.jsonl"
            echo "CC_RECEIVER_OFFLINE_EXPECTATION=$RUNNER_TEMP/receiver-offline-expectation.json"
            echo "CC_RECEIVER_GH=$GH_ATTESTATION_CLI"
          } >> "$GITHUB_ENV"
          chmod 600 "$RUNNER_TEMP/receiver-expected-identity.json" "$RUNNER_TEMP/receiver-offline-expectation.json"

      - name: Run mandatory genuine Linux/OpenSSH receiver integration
        run: |
          set -euo pipefail
          test "$CC_REAL_RECEIVER" = 1
          test "$CC_RECEIVER_NETWORK_DISABLED" = 1
          python -m unittest tests.test_trusted_ssh_artifact_delivery.TrustedSshDeliveryTests.test_real_openssh_receiver_and_exclusive_host_pinning -v

      - name: Require supported official GitHub CLI verifier
        run: |
          set -euo pipefail
          actual="$("$GH_ATTESTATION_CLI" version | awk 'NR == 1 { print $3 }')"
          test "$actual" = "$GH_ATTESTATION_CLI_VERSION"

      - name: Acquire independently trusted offline verification root
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          trusted_root="$RUNNER_TEMP/trusted_root.jsonl"
          "$GH_ATTESTATION_CLI" attestation trusted-root > "$trusted_root"
          test -s "$trusted_root"
          chmod 600 "$trusted_root"
          sha256sum "$trusted_root" | tee "$RUNNER_TEMP/trusted-root.sha256"
          echo "Trusted root was acquired before network-disabled verification and retained outside the checkout." >> "$GITHUB_STEP_SUMMARY"

      - name: Select exact artifact-service ZIP and inner archive
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_ARTIFACT_REPOSITORY_ID: ${{ github.repository_id }}
          RUNTIME_ARTIFACT_REPOSITORY_OWNER_ID: ${{ github.repository_owner_id }}
          RUNTIME_ARTIFACT_SIGNER_REVISION: ${{ github.workflow_sha }}
          RUNTIME_ARTIFACT_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          RUNTIME_ARTIFACT_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          RUNTIME_ARTIFACT_PR_HEAD_REF: ${{ github.event.pull_request.head.ref || '' }}
          RUNTIME_ARTIFACT_PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          RUNTIME_ARTIFACT_PR_BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
          RUNTIME_ARTIFACT_RUN_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          RUNTIME_ARTIFACT_RUN_HEAD_REPOSITORY_ID: ${{ github.event.pull_request.head.repo.id || github.repository_id }}
          RUNTIME_ARTIFACT_RUN_HEAD_OWNER_ID: ${{ github.event.pull_request.head.repo.owner.id || github.repository_owner_id }}
          RUNTIME_ARTIFACT_RUN_HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
          RUNTIME_ARTIFACT_RUN_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          archive="$(find "$RUNNER_TEMP/retrieved-runtime-artifact" -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          test -n "$archive"
          archive_name="$(basename "$archive")"
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --argjson repository_id "$RUNTIME_ARTIFACT_REPOSITORY_ID" \
            --argjson repository_owner_id "$RUNTIME_ARTIFACT_REPOSITORY_OWNER_ID" \
            --arg source_ref "$GITHUB_REF" \
            --arg source_sha "$GITHUB_SHA" \
            --arg event "$GITHUB_EVENT_NAME" \
            --arg signer_workflow "$RUNTIME_ARTIFACT_SIGNER_WORKFLOW" \
            --arg signer_revision "$RUNTIME_ARTIFACT_SIGNER_REVISION" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg artifact_name "runtime-artifact-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --arg artifact_class "development-runtime-evidence" \
            --arg archive_name "$archive_name" \
            --arg platform "$RUNTIME_ARTIFACT_PLATFORM" \
            --arg image "$RUNTIME_ARTIFACT_IMAGE" \
            --arg image_digest "${RUNTIME_ARTIFACT_IMAGE##*@}" \
            --arg authorization_context "ci-selection-only" \
            --arg run_head_repository "$RUNTIME_ARTIFACT_RUN_HEAD_REPOSITORY" \
            --argjson run_head_repository_id "$RUNTIME_ARTIFACT_RUN_HEAD_REPOSITORY_ID" \
            --argjson run_head_repository_owner_id "$RUNTIME_ARTIFACT_RUN_HEAD_OWNER_ID" \
            --arg run_head_ref "$RUNTIME_ARTIFACT_RUN_HEAD_REF" \
            --arg run_head_sha "$RUNTIME_ARTIFACT_RUN_HEAD_SHA" \
            --arg pr_number "$RUNTIME_ARTIFACT_PR_NUMBER" \
            --arg pr_head_sha "$RUNTIME_ARTIFACT_PR_HEAD_SHA" \
            --arg pr_head_ref "$RUNTIME_ARTIFACT_PR_HEAD_REF" \
            --arg pr_base_sha "$RUNTIME_ARTIFACT_PR_BASE_SHA" \
            --arg pr_base_ref "$RUNTIME_ARTIFACT_PR_BASE_REF" \
            '{repository:$repository,repository_id:$repository_id,repository_owner_id:$repository_owner_id,source_ref:$source_ref,source_sha:$source_sha,event:$event,signer_workflow:$signer_workflow,signer_revision:$signer_revision,run_id:$run_id,run_attempt:$run_attempt,artifact_name:$artifact_name,artifact_class:$artifact_class,archive_name:$archive_name,platform:$platform,image:$image,image_digest:$image_digest,authorization_context:$authorization_context,run_head_repository:$run_head_repository,run_head_repository_id:$run_head_repository_id,run_head_repository_owner_id:$run_head_repository_owner_id,run_head_ref:(if $event == "push" then $source_ref else ("refs/heads/" + $run_head_ref) end),run_head_sha:$run_head_sha,pull_request_number:(if $pr_number == "" then null else ($pr_number|tonumber) end),pull_request_head_sha:(if $pr_head_sha == "" then null else $pr_head_sha end),pull_request_head_ref:(if $pr_head_ref == "" then null else ("refs/heads/" + $pr_head_ref) end),pull_request_base_sha:(if $pr_base_sha == "" then null else $pr_base_sha end),pull_request_base_ref:(if $pr_base_ref == "" then null else ("refs/heads/" + $pr_base_ref) end)}' \
            > "$RUNNER_TEMP/exact-selection-request.json"
          python scripts/runtime_artifact_provenance.py \
            --selection-request "$RUNNER_TEMP/exact-selection-request.json" \
            --selection-download-service-zip "$RUNNER_TEMP/artifact-service.zip" \
            | tee "$RUNNER_TEMP/exact-selection.json"
          jq -e '.authoritative == false and .byteVerified == true and .selection.archiveName == $name and .selection.archiveSha256 == $digest' \
            --arg name "$archive_name" \
            --arg digest "$(sha256sum "$archive" | awk '{ print $1 }')" \
            "$RUNNER_TEMP/exact-selection.json" >/dev/null

      - name: Exercise real API and ZIP negative mutations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/exact-run-attempt.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/run-artifacts.json"
          python - "$RUNNER_TEMP/exact-selection-request.json" "$RUNNER_TEMP/exact-run-attempt.json" "$RUNNER_TEMP/run-artifacts.json" "$RUNNER_TEMP/artifact-service.zip" "$RUNNER_TEMP/exact-selection.json" <<'PY'
          import copy
          import json
          import sys
          from datetime import datetime, timezone
          from pathlib import Path
          sys.path.insert(0, "scripts")
          import runtime_artifact_provenance as provenance

          request = provenance.selection_request_from_json(json.loads(Path(sys.argv[1]).read_text(encoding="utf-8")))
          run_metadata = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          artifact_response = json.loads(Path(sys.argv[3]).read_text(encoding="utf-8"))
          selected = json.loads(Path(sys.argv[5]).read_text(encoding="utf-8"))["selection"]
          captured_now = datetime.now(timezone.utc)

          def expect_rejection(label, reason, operation):
              try:
                  operation()
              except provenance.ProvenanceError as error:
                  assert reason in str(error), f"{label} rejected for unexpected reason: {error}"
                  return
              raise AssertionError(f"{label} was accepted")

          exact_artifact = provenance._select_artifact_metadata(artifact_response, request, run_metadata, now=captured_now)
          provenance.validate_exact_run_attempt_request_metadata(run_metadata, request, now=captured_now)
          assert exact_artifact["id"] == selected["artifactId"], "unmodified real API evidence did not select the downloaded artifact"

          wrong_run = copy.deepcopy(run_metadata)
          wrong_run["head_sha"] = "0" * 40
          expected_source_reason = "exact PR run head mismatch" if request.event == "pull_request" else "main/development push source SHA mismatch"
          expect_rejection("wrong real run head SHA", expected_source_reason, lambda: provenance.validate_exact_run_attempt_request_metadata(wrong_run, request, now=captured_now))

          exact_artifacts = [item for item in artifact_response["artifacts"] if item.get("name") == request.artifact_name]
          assert len(exact_artifacts) == 1, "real exact artifact is missing or ambiguous"
          wrong_artifact = copy.deepcopy(exact_artifacts[0])
          wrong_artifact["workflow_run"]["head_repository_id"] = request.repository_id + 1
          wrong_response = {"total_count": 1, "artifacts": [wrong_artifact]}
          expect_rejection("wrong real artifact head repository", "artifact head repository ID mismatch", lambda: provenance._select_artifact_metadata(wrong_response, request, run_metadata, now=captured_now))

          duplicate = copy.deepcopy(exact_artifacts[0])
          duplicate["name"] = "different-artifact-name"
          duplicate_response = {"total_count": 2, "artifacts": [exact_artifacts[0], duplicate]}
          expect_rejection("duplicate real artifact ID across names", "duplicate artifact ID", lambda: provenance.validate_artifact_api_response(duplicate_response))
          expect_rejection("truncated real artifact page", "pagination is incomplete", lambda: provenance.validate_artifact_api_response({"total_count": 2, "artifacts": [exact_artifacts[0]]}))

          source = Path(sys.argv[4])
          snapshot = provenance.open_zip_snapshot(source)
          try:
              expect_rejection("wrong real outer ZIP digest", "downloaded artifact service ZIP digest mismatch", lambda: provenance.verify_artifact_service_zip_snapshot(snapshot, "0" * 64, selected["artifactServiceZipBytes"]))
              expect_rejection("wrong real inner archive digest", "inner runtime archive digest mismatch", lambda: provenance.inspect_artifact_service_zip_snapshot(snapshot, selected["archiveName"], "0" * 64, selected["archiveBytes"]))
          finally:
              provenance.close_zip_snapshot(snapshot)
          print("unmodified real API evidence passed; real API, outer ZIP, and inner archive negative mutations rejected")
          PY

      - name: Validate retrieved bytes and safely extract
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_ARTIFACT_REPOSITORY_ID: ${{ github.repository_id }}
          RUNTIME_ARTIFACT_REPOSITORY_OWNER_ID: ${{ github.repository_owner_id }}
          RUNTIME_ARTIFACT_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility || 'public' }}
          RUNTIME_ARTIFACT_SIGNER_REVISION: ${{ github.workflow_sha }}
          RUNTIME_ARTIFACT_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          RUNTIME_ARTIFACT_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          RUNTIME_ARTIFACT_PR_HEAD_REF: ${{ github.event.pull_request.head.ref || '' }}
          RUNTIME_ARTIFACT_PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          RUNTIME_ARTIFACT_PR_BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
        run: |
          set -euo pipefail
          mapfile -t archives < <(find "$RUNNER_TEMP/retrieved-runtime-artifact" -maxdepth 1 -type f -name '*.tar.gz' -print)
          test "${#archives[@]}" -eq 1
          archive="${archives[0]}"
          mapfile -t bundles < <(find "$RUNNER_TEMP/retrieved-runtime-attestation" -maxdepth 2 -type f -name '*.json' -print)
          test "${#bundles[@]}" -eq 1
          bundle="${bundles[0]}"
          validation_output="$(bash ./scripts/validate-runtime-artifact.sh \
            --archive "$archive" \
            --checksum "$archive.sha256" \
            --manifest "$archive.manifest.json" \
            --expected-sha "$GITHUB_SHA" \
            --expected-platform "$RUNTIME_ARTIFACT_PLATFORM" \
            --expected-repository "$GITHUB_REPOSITORY" \
            --expected-workflow "$GITHUB_WORKFLOW" \
            --expected-run-id "$GITHUB_RUN_ID" \
            --expected-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --expected-event "$GITHUB_EVENT_NAME" \
            --expected-source-ref "$GITHUB_REF" \
            --expected-repository-id "$RUNTIME_ARTIFACT_REPOSITORY_ID" \
            --expected-repository-owner-id "$RUNTIME_ARTIFACT_REPOSITORY_OWNER_ID" \
            --expected-repository-visibility "$RUNTIME_ARTIFACT_REPOSITORY_VISIBILITY" \
            --expected-signer-workflow "$RUNTIME_ARTIFACT_SIGNER_WORKFLOW" \
            --expected-signer-revision "$RUNTIME_ARTIFACT_SIGNER_REVISION" \
            --expected-pr-number "${RUNTIME_ARTIFACT_PR_NUMBER:-0}" \
            --expected-pr-head-sha "$RUNTIME_ARTIFACT_PR_HEAD_SHA" \
            --expected-pr-head-ref "$RUNTIME_ARTIFACT_PR_HEAD_REF" \
            --expected-pr-base-sha "$RUNTIME_ARTIFACT_PR_BASE_SHA" \
            --expected-pr-base-ref "$RUNTIME_ARTIFACT_PR_BASE_REF" \
            --expected-gh-version "$GH_ATTESTATION_CLI_VERSION" \
            --expected-base-image "$RUNTIME_ARTIFACT_IMAGE" \
            --expected-base-image-digest "${RUNTIME_ARTIFACT_IMAGE##*@}" \
            --require-attestation \
            --attestation-bundle "$bundle" \
            --provenance-output "$RUNNER_TEMP/authenticated-development-provenance.json" \
            --source-root "$GITHUB_WORKSPACE" \
            --extract "$RUNNER_TEMP/extracted-runtime-artifact")"
          printf '%s\n' "$validation_output"
          {
            echo "## FB-028B bounded validation/extraction"
            jq -r '"- Elapsed: \(.measurements.elapsedMs) ms\n- Headers: \(.measurements.headers.totalHeaders) total / \(.measurements.headers.metadataHeaders) metadata\n- Physical metadata: \(.measurements.headers.physicalMetadataBytes) bytes\n- Archive: \(.archiveBytes) bytes\n- Extracted footprint: \(.extractedFootprintBytes) bytes\n- Estimated temporary disk: \(.measurements.temporaryDiskBytesRequired) bytes\n- Peak memory: \(.measurements.peakMemoryBytes // "unavailable")"' <<< "$validation_output"
          } >> "$GITHUB_STEP_SUMMARY"
          jq -e '.productionEligibility | .eligible == false and .authoritative == false and .reasonCode == "development-artifact-class"' \
            "$RUNNER_TEMP/authenticated-development-provenance.json" >/dev/null

      - name: Verify genuine attestation offline without token or network
        env:
          RUNTIME_ARTIFACT_REPOSITORY_ID: ${{ github.repository_id }}
          RUNTIME_ARTIFACT_REPOSITORY_OWNER_ID: ${{ github.repository_owner_id }}
          RUNTIME_ARTIFACT_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility || 'public' }}
          RUNTIME_ARTIFACT_SIGNER_REVISION: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          archive="$(find "$RUNNER_TEMP/retrieved-runtime-artifact" -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          bundle="$(find "$RUNNER_TEMP/retrieved-runtime-attestation" -maxdepth 2 -type f -name '*.json' -print -quit)"
          test -n "$archive" -a -n "$bundle"
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg repository_id "$RUNTIME_ARTIFACT_REPOSITORY_ID" \
            --arg repository_owner_id "$RUNTIME_ARTIFACT_REPOSITORY_OWNER_ID" \
            --arg repository_visibility "$RUNTIME_ARTIFACT_REPOSITORY_VISIBILITY" \
            --arg signer_workflow "$RUNTIME_ARTIFACT_SIGNER_WORKFLOW" \
            --arg signer_revision "$RUNTIME_ARTIFACT_SIGNER_REVISION" \
            --arg source_ref "$GITHUB_REF" \
            --arg source_sha "$GITHUB_SHA" \
            --arg event "$GITHUB_EVENT_NAME" \
            --arg workflow_name "$GITHUB_WORKFLOW" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg platform "$RUNTIME_ARTIFACT_PLATFORM" \
            --arg image "$RUNTIME_ARTIFACT_IMAGE" \
            --arg image_digest "${RUNTIME_ARTIFACT_IMAGE##*@}" \
            '{repository:$repository,repository_id:$repository_id,repository_owner_id:$repository_owner_id,repository_visibility:$repository_visibility,signer_workflow:$signer_workflow,signer_revision:$signer_revision,source_ref:$source_ref,source_sha:$source_sha,event:$event,workflow_name:$workflow_name,run_id:$run_id,run_attempt:$run_attempt,platform:$platform,image:$image,image_digest:$image_digest,artifact_class:"development-runtime-evidence"}' \
            > "$RUNNER_TEMP/offline-expectation.json"
          runner_user="$(id -un)"
          sudo -n unshare --net --mount-proc --fork runuser -u "$runner_user" -- env -i \
            PATH="/usr/bin:/bin" \
            GH_ATTESTATION_CLI="$GH_ATTESTATION_CLI" \
            PYTHONPATH="$GITHUB_WORKSPACE/scripts" \
            python3 - "$archive" "$bundle" "$RUNNER_TEMP/trusted_root.jsonl" "$RUNNER_TEMP/offline-expectation.json" "$GITHUB_WORKSPACE" <<'PY'
          import json
          import sys
          from pathlib import Path
          import runtime_artifact_provenance as provenance

          archive, bundle, trusted_root, expectation_path, repository_root = map(Path, sys.argv[1:])
          expectation = json.loads(expectation_path.read_text(encoding="utf-8"))
          result = provenance.run_gh_attestation_verify(
              archive,
              bundle=bundle,
              repository=expectation["repository"],
              signer_workflow=expectation["signer_workflow"],
              signer_revision=expectation["signer_revision"],
              source_ref=expectation["source_ref"],
              source_sha=expectation["source_sha"],
              custom_trusted_root=trusted_root,
              offline=True,
              repository_root=repository_root,
          )
          verified = provenance.validate_verified_result(
              result,
              archive_name=archive.name,
              archive_digest=provenance._sha256_file(archive, provenance.MAX_ARCHIVE_BYTES, "offline archive")[0],
              archive_bytes=archive.stat().st_size,
              expected=expectation,
              run_metadata=None,
              require_run_metadata=False,
          )
          assert not verified.run_metadata_independently_checked
          print("genuine pinned-gh offline attestation verification passed without token or network")
          PY

      - name: Verify synthetic policy output is explicitly non-authoritative
        run: |
          set -euo pipefail
          jq -n '{fixtureKind: "synthetic-production-policy", synthetic: true}' > "$RUNNER_TEMP/synthetic-production-policy.json"
          synthetic_output="$(python scripts/runtime_artifact_provenance.py \
            --evaluate-synthetic-policy \
            --fixture "$RUNNER_TEMP/synthetic-production-policy.json")"
          jq -e '.eligible == true and .authoritative == false and .reasonCode == "synthetic-policy-fixture"' <<< "$synthetic_output" >/dev/null

      - name: Reject modified subject bytes with the official verifier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t archives < <(find "$RUNNER_TEMP/retrieved-runtime-artifact" -maxdepth 1 -type f -name '*.tar.gz' -print)
          test "${#archives[@]}" -eq 1
          archive="${archives[0]}"
          mapfile -t bundles < <(find "$RUNNER_TEMP/retrieved-runtime-attestation" -maxdepth 2 -type f -name '*.json' -print)
          test "${#bundles[@]}" -eq 1
          bundle="${bundles[0]}"
          verify_subject() {
            "$GH_ATTESTATION_CLI" attestation verify "$1" \
              --repo "$GITHUB_REPOSITORY" \
              --bundle "$bundle" \
              --signer-workflow "$GITHUB_REPOSITORY/$RUNTIME_ARTIFACT_SIGNER_WORKFLOW" \
              --signer-digest "$RUNTIME_ARTIFACT_SIGNER_REVISION" \
              --source-ref "$GITHUB_REF" \
              --source-digest "$GITHUB_SHA" \
              --predicate-type https://slsa.dev/provenance/v1 \
              --format json
          }
          original_output="$(verify_subject "$archive")"
          jq -e 'type == "array" and length == 1 and (.[0].verificationResult.statement.subject | length == 1)' <<< "$original_output" >/dev/null
          original_digest="$(sha256sum "$archive" | awk '{ print $1 }')"
          cp "$archive" "$RUNNER_TEMP/tampered-runtime-artifact.tar.gz"
          python -c 'from pathlib import Path; p=Path(__import__("sys").argv[1]); b=bytearray(p.read_bytes()); b[len(b)//2] ^= 1; p.write_bytes(b)' "$RUNNER_TEMP/tampered-runtime-artifact.tar.gz"
          tampered_digest="$(sha256sum "$RUNNER_TEMP/tampered-runtime-artifact.tar.gz" | awk '{ print $1 }')"
          test "$tampered_digest" != "$original_digest"
          set +e
          tampered_output="$(verify_subject "$RUNNER_TEMP/tampered-runtime-artifact.tar.gz" 2>&1)"
          tampered_status=$?
          set -e
          test "$tampered_status" -ne 0
          test -n "$tampered_output"
          if grep -Eqi 'HTTP [0-9]{3}|unauthori[sz]ed|permission|token|network|timeout|unknown|usage|invalid option|not found|connect|resolve|panic|segmentation|command' <<< "$tampered_output"; then
            echo "Modified-subject verification failed operationally: $tampered_output" >&2
            exit 1
          fi
          if grep -Fq 'verifying with issuer "sigstore.dev"' <<< "$tampered_output"; then
            echo 'Upstream gh v2.89.0 reports a generic issuer-verification error for the controlled digest negative.' >> "$GITHUB_STEP_SUMMARY"
          elif grep -Eqi 'verification|signature|certificate|digest|subject' <<< "$tampered_output"; then
            echo 'Upstream gh returned a specific controlled verification failure for the digest negative.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Modified-subject verification failed with unexplained output: $tampered_output" >&2
            exit 1
          fi
          recovered_output="$(verify_subject "$archive")"
          jq -e 'type == "array" and length == 1 and (.[0].verificationResult.statement.subject | length == 1)' <<< "$recovered_output" >/dev/null

      - name: Reject mismatched source expectations with the official verifier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t archives < <(find "$RUNNER_TEMP/retrieved-runtime-artifact" -maxdepth 1 -type f -name '*.tar.gz' -print)
          test "${#archives[@]}" -eq 1
          archive="${archives[0]}"
          mapfile -t bundles < <(find "$RUNNER_TEMP/retrieved-runtime-attestation" -maxdepth 2 -type f -name '*.json' -print)
          test "${#bundles[@]}" -eq 1
          bundle="${bundles[0]}"
          if mismatched_output="$("$GH_ATTESTATION_CLI" attestation verify "$archive" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$bundle" \
            --source-ref refs/heads/main \
            --source-digest "$GITHUB_SHA" \
            --predicate-type https://slsa.dev/provenance/v1 \
            --format json 2>&1)"; then
            echo 'The official verifier accepted a mismatched source ref' >&2
            exit 1
          elif ! grep -Fq 'expected SourceRepositoryRef to be refs/heads/main' <<< "$mismatched_output"; then
            echo "Mismatched-source verification failed operationally or for an unexpected reason: $mismatched_output" >&2
            exit 1
          fi

      - name: Start disposable PostgreSQL for runtime engine probe
        run: |
          set -euo pipefail
          docker network create runtime-artifact-validation
          docker run -d --name runtime-artifact-postgres \
            --network runtime-artifact-validation \
            -e POSTGRES_PASSWORD=artifact-test-password \
            -e POSTGRES_DB=artifact_probe \
            postgres:17-alpine
          for attempt in $(seq 1 30); do
            if docker exec runtime-artifact-postgres pg_isready -U postgres -d artifact_probe >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          exit 1

      - name: Exercise extracted runtime without install, compile, or Prisma regeneration
        env:
          DATABASE_URL: postgresql://postgres:artifact-test-password@runtime-artifact-postgres:5432/artifact_probe?schema=public
        run: |
          set -euo pipefail
          archive="$(find "$RUNNER_TEMP/retrieved-runtime-artifact" -maxdepth 1 -name '*.tar.gz' -print -quit)"
          docker run --rm \
            --platform "$RUNTIME_ARTIFACT_PLATFORM" \
            --network runtime-artifact-validation \
            -e DATABASE_URL \
            -v "$RUNNER_TEMP/extracted-runtime-artifact:/runtime:ro" \
            -v "$GITHUB_WORKSPACE/scripts/runtime-artifact-probe.js:/probe.js:ro" \
            "$RUNTIME_ARTIFACT_IMAGE" bash -euo pipefail -c '
              test -x /runtime/node_modules/.bin/prisma
              test -s /runtime/dist/ClashCookies.js
              /runtime/node_modules/.bin/prisma --version
              /runtime/node_modules/.bin/prisma validate --schema /runtime/prisma/schema.prisma
              RUNTIME_ROOT=/runtime node /probe.js
            '

      - name: Clean disposable validation services
        if: always()
        run: |
          docker rm -f runtime-artifact-postgres >/dev/null 2>&1 || true
          docker network rm runtime-artifact-validation >/dev/null 2>&1 || true
