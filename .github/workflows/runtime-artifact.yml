name: Runtime Artifact Round Trip

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read

env:
  RUNTIME_ARTIFACT_IMAGE: node:20-bookworm@sha256:8f693eaa7e0a8e71560c9a82b55fd54c2ae920a2ba5d2cde28bac7d1c01c9ba5
  RUNTIME_ARTIFACT_PLATFORM: linux/amd64
  RUNTIME_ARTIFACT_SIGNER_WORKFLOW: .github/workflows/runtime-artifact.yml
  GH_ATTESTATION_CLI_VERSION: 2.89.0

jobs:
  build-runtime-artifact:
    name: Build SHA-bound runtime artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact workflow revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build runtime artifact in pinned Linux environment
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_WORKFLOW_PATH: .github/workflows/runtime-artifact.yml
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/runtime-artifact"
          bash ./scripts/build-runtime-artifact.sh \
            --output "$RUNNER_TEMP/runtime-artifact" \
            --image "$RUNTIME_ARTIFACT_IMAGE" \
            --platform "$RUNTIME_ARTIFACT_PLATFORM" \
            --expected-sha "$GITHUB_SHA"
          jq -e '.artifact.nonProductionEvidence == true and .identity.deployableRelease == false and .build.baseImageDigest' \
            "$RUNNER_TEMP/runtime-artifact"/*.manifest.json
          manifest="$RUNNER_TEMP/runtime-artifact/$(basename "$(find "$RUNNER_TEMP/runtime-artifact" -maxdepth 1 -name '*.manifest.json' -print -quit)")"
          {
            echo "## FB-028A runtime artifact"
            jq -r '"- Build duration: \(.build.durationMs) ms\n- Archive size: \(.measurements.archiveBytes) bytes\n- Extracted footprint: \(.measurements.extractedFootprintBytes) bytes\n- Source SHA: `\(.source.gitSha)`\n- Base image: `\(.build.baseImage)`"' "$manifest"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish development validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: runtime-artifact-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime-artifact
          if-no-files-found: error
          retention-days: 3
          include-hidden-files: true

  attest-runtime-artifact:
    name: Generate authenticated development attestation
    needs: build-runtime-artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Download built artifact into the signer job
        uses: actions/download-artifact@v4
        with:
          name: runtime-artifact-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/attestation-input

      - name: Generate GitHub-native provenance attestation
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/attestation-input/*.tar.gz

      - name: Publish attestation bundle for independent verification
        uses: actions/upload-artifact@v4
        with:
          name: runtime-artifact-attestation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 3
          include-hidden-files: true

  validate-runtime-artifact:
    name: Retrieve and validate runtime artifact
    needs: attest-runtime-artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout validation probe only
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download published artifact into a fresh job
        uses: actions/download-artifact@v4
        with:
          name: runtime-artifact-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/retrieved-runtime-artifact

      - name: Download authenticated attestation bundle into a fresh job
        uses: actions/download-artifact@v4
        with:
          name: runtime-artifact-attestation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/retrieved-runtime-attestation

      - name: Run Linux descriptor-boundary regressions
        run: python -m unittest discover -s tests -p 'test_runtime_artifact_security.py' -v

      - name: Run provenance contract regressions
        run: python -m unittest discover -s tests -p 'test_runtime_artifact_provenance.py' -v

      - name: Require supported official GitHub CLI verifier
        run: |
          set -euo pipefail
          actual="$(gh version | awk 'NR == 1 { print $3 }')"
          test "$actual" = "$GH_ATTESTATION_CLI_VERSION"

      - name: Validate retrieved bytes and safely extract
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_ARTIFACT_REPOSITORY_ID: ${{ github.repository_id }}
          RUNTIME_ARTIFACT_SIGNER_REVISION: ${{ github.workflow_sha }}
          RUNTIME_ARTIFACT_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          RUNTIME_ARTIFACT_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          RUNTIME_ARTIFACT_PR_HEAD_REF: ${{ github.event.pull_request.head.ref || '' }}
          RUNTIME_ARTIFACT_PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          RUNTIME_ARTIFACT_PR_BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
        run: |
          set -euo pipefail
          mapfile -t archives < <(find "$RUNNER_TEMP/retrieved-runtime-artifact" -maxdepth 1 -type f -name '*.tar.gz' -print)
          test "${#archives[@]}" -eq 1
          archive="${archives[0]}"
          mapfile -t bundles < <(find "$RUNNER_TEMP/retrieved-runtime-attestation" -maxdepth 2 -type f -name '*.json' -print)
          test "${#bundles[@]}" -eq 1
          bundle="${bundles[0]}"
          validation_output="$(bash ./scripts/validate-runtime-artifact.sh \
            --archive "$archive" \
            --checksum "$archive.sha256" \
            --manifest "$archive.manifest.json" \
            --expected-sha "$GITHUB_SHA" \
            --expected-platform "$RUNTIME_ARTIFACT_PLATFORM" \
            --expected-repository "$GITHUB_REPOSITORY" \
            --expected-workflow "$GITHUB_WORKFLOW" \
            --expected-run-id "$GITHUB_RUN_ID" \
            --expected-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --expected-event "$GITHUB_EVENT_NAME" \
            --expected-source-ref "$GITHUB_REF" \
            --expected-repository-id "$RUNTIME_ARTIFACT_REPOSITORY_ID" \
            --expected-signer-workflow "$RUNTIME_ARTIFACT_SIGNER_WORKFLOW" \
            --expected-signer-revision "$RUNTIME_ARTIFACT_SIGNER_REVISION" \
            --expected-pr-number "${RUNTIME_ARTIFACT_PR_NUMBER:-0}" \
            --expected-pr-head-sha "$RUNTIME_ARTIFACT_PR_HEAD_SHA" \
            --expected-pr-head-ref "$RUNTIME_ARTIFACT_PR_HEAD_REF" \
            --expected-pr-base-sha "$RUNTIME_ARTIFACT_PR_BASE_SHA" \
            --expected-pr-base-ref "$RUNTIME_ARTIFACT_PR_BASE_REF" \
            --expected-gh-version "$GH_ATTESTATION_CLI_VERSION" \
            --expected-base-image "$RUNTIME_ARTIFACT_IMAGE" \
            --expected-base-image-digest "${RUNTIME_ARTIFACT_IMAGE##*@}" \
            --require-attestation \
            --attestation-bundle "$bundle" \
            --provenance-output "$RUNNER_TEMP/authenticated-development-provenance.json" \
            --source-root "$GITHUB_WORKSPACE" \
            --extract "$RUNNER_TEMP/extracted-runtime-artifact")"
          printf '%s\n' "$validation_output"
          {
            echo "## FB-028B bounded validation/extraction"
            jq -r '"- Elapsed: \(.measurements.elapsedMs) ms\n- Headers: \(.measurements.headers.totalHeaders) total / \(.measurements.headers.metadataHeaders) metadata\n- Physical metadata: \(.measurements.headers.physicalMetadataBytes) bytes\n- Archive: \(.archiveBytes) bytes\n- Extracted footprint: \(.extractedFootprintBytes) bytes\n- Estimated temporary disk: \(.measurements.temporaryDiskBytesRequired) bytes\n- Peak memory: \(.measurements.peakMemoryBytes // "unavailable")"' <<< "$validation_output"
          } >> "$GITHUB_STEP_SUMMARY"
          jq -e '.productionEligibility | .eligible == false and .authoritative == false and .reasonCode == "development-artifact-class"' \
            "$RUNNER_TEMP/authenticated-development-provenance.json" >/dev/null

      - name: Verify synthetic policy output is explicitly non-authoritative
        run: |
          set -euo pipefail
          jq -n '{fixtureKind: "synthetic-production-policy", synthetic: true}' > "$RUNNER_TEMP/synthetic-production-policy.json"
          synthetic_output="$(python scripts/runtime_artifact_provenance.py \
            --evaluate-synthetic-policy \
            --fixture "$RUNNER_TEMP/synthetic-production-policy.json")"
          jq -e '.eligible == true and .authoritative == false and .reasonCode == "synthetic-policy-fixture"' <<< "$synthetic_output" >/dev/null

      - name: Reject modified subject bytes with the official verifier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t archives < <(find "$RUNNER_TEMP/retrieved-runtime-artifact" -maxdepth 1 -type f -name '*.tar.gz' -print)
          test "${#archives[@]}" -eq 1
          archive="${archives[0]}"
          mapfile -t bundles < <(find "$RUNNER_TEMP/retrieved-runtime-attestation" -maxdepth 2 -type f -name '*.json' -print)
          test "${#bundles[@]}" -eq 1
          bundle="${bundles[0]}"
          cp "$archive" "$RUNNER_TEMP/tampered-runtime-artifact.tar.gz"
          python -c 'from pathlib import Path; p=Path(__import__("sys").argv[1]); b=bytearray(p.read_bytes()); b[len(b)//2] ^= 1; p.write_bytes(b)' "$RUNNER_TEMP/tampered-runtime-artifact.tar.gz"
          if tampered_output="$(gh attestation verify "$RUNNER_TEMP/tampered-runtime-artifact.tar.gz" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$bundle" \
            --predicate-type https://slsa.dev/provenance/v1 \
            --format json 2>&1)"; then
            echo 'The official verifier accepted modified subject bytes' >&2
            exit 1
          elif ! grep -Fq 'verifying with issuer "sigstore.dev"' <<< "$tampered_output"; then
            echo "Modified-subject verification failed operationally or for an unexpected reason: $tampered_output" >&2
            exit 1
          fi

      - name: Reject mismatched source expectations with the official verifier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t archives < <(find "$RUNNER_TEMP/retrieved-runtime-artifact" -maxdepth 1 -type f -name '*.tar.gz' -print)
          test "${#archives[@]}" -eq 1
          archive="${archives[0]}"
          mapfile -t bundles < <(find "$RUNNER_TEMP/retrieved-runtime-attestation" -maxdepth 2 -type f -name '*.json' -print)
          test "${#bundles[@]}" -eq 1
          bundle="${bundles[0]}"
          if mismatched_output="$(gh attestation verify "$archive" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$bundle" \
            --source-ref refs/heads/main \
            --source-digest "$GITHUB_SHA" \
            --predicate-type https://slsa.dev/provenance/v1 \
            --format json 2>&1)"; then
            echo 'The official verifier accepted a mismatched source ref' >&2
            exit 1
          elif ! grep -Fq 'expected SourceRepositoryRef to be refs/heads/main' <<< "$mismatched_output"; then
            echo "Mismatched-source verification failed operationally or for an unexpected reason: $mismatched_output" >&2
            exit 1
          fi

      - name: Start disposable PostgreSQL for runtime engine probe
        run: |
          set -euo pipefail
          docker network create runtime-artifact-validation
          docker run -d --name runtime-artifact-postgres \
            --network runtime-artifact-validation \
            -e POSTGRES_PASSWORD=artifact-test-password \
            -e POSTGRES_DB=artifact_probe \
            postgres:17-alpine
          for attempt in $(seq 1 30); do
            if docker exec runtime-artifact-postgres pg_isready -U postgres -d artifact_probe >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          exit 1

      - name: Exercise extracted runtime without install, compile, or Prisma regeneration
        env:
          DATABASE_URL: postgresql://postgres:artifact-test-password@runtime-artifact-postgres:5432/artifact_probe?schema=public
        run: |
          set -euo pipefail
          archive="$(find "$RUNNER_TEMP/retrieved-runtime-artifact" -maxdepth 1 -name '*.tar.gz' -print -quit)"
          docker run --rm \
            --platform "$RUNTIME_ARTIFACT_PLATFORM" \
            --network runtime-artifact-validation \
            -e DATABASE_URL \
            -v "$RUNNER_TEMP/extracted-runtime-artifact:/runtime:ro" \
            -v "$GITHUB_WORKSPACE/scripts/runtime-artifact-probe.js:/probe.js:ro" \
            "$RUNTIME_ARTIFACT_IMAGE" bash -euo pipefail -c '
              test -x /runtime/node_modules/.bin/prisma
              test -s /runtime/dist/ClashCookies.js
              /runtime/node_modules/.bin/prisma --version
              /runtime/node_modules/.bin/prisma validate --schema /runtime/prisma/schema.prisma
              RUNTIME_ROOT=/runtime node /probe.js
            '

      - name: Clean disposable validation services
        if: always()
        run: |
          docker rm -f runtime-artifact-postgres >/dev/null 2>&1 || true
          docker network rm runtime-artifact-validation >/dev/null 2>&1 || true
