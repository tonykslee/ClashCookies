name: Deploy Production

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  classify:
    # Fail closed until the separately installed entrypoint and production gates are verified.
    # The repository variable is intentionally absent/false during the release hold.
    if: vars.PRODUCTION_DEPLOYMENT_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      old_sha: ${{ steps.release.outputs.old_sha }}
      new_sha: ${{ steps.release.outputs.new_sha }}
      release_id: ${{ steps.release.outputs.release_id }}
      migration_diff_digest: ${{ steps.release.outputs.migration_diff_digest }}
      migration_manifest_digest: ${{ steps.release.outputs.migration_manifest_digest }}
      authorization_digest: ${{ steps.release.outputs.authorization_digest }}
      has_migrations: ${{ steps.release.outputs.has_migrations }}
    steps:
      - name: Checkout exact main revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bind release identity and classify Prisma changes
        id: release
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          NEW_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if [[ "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            echo "Initial main push has no safe previous revision" >&2
            exit 78
          fi
          git rev-parse --verify "$BEFORE_SHA^{commit}" >/dev/null
          git rev-parse --verify "$NEW_SHA^{commit}" >/dev/null
          release_id="main-${RUN_ID}-${RUN_ATTEMPT}"
          migration_diff_digest="$(git diff --binary --no-ext-diff "$BEFORE_SHA" "$NEW_SHA" -- prisma/schema.prisma prisma/migrations | sha256sum | awk '{print tolower($1)}')"
          migration_manifest_digest="$(node -e 'const r=require("./ops/deploy/migration-runner.js"); process.stdout.write(r.computeMigrationManifest(process.cwd()).digest)' | tr '[:upper:]' '[:lower:]')"
          if git diff --quiet --no-ext-diff "$BEFORE_SHA" "$NEW_SHA" -- prisma/schema.prisma prisma/migrations; then
            has_migrations=false
          else
            has_migrations=true
          fi
          authorization_digest="$(printf '%s|%s|%s|%s|%s|github-environment-production-migration' "$release_id" "$BEFORE_SHA" "$NEW_SHA" "$migration_diff_digest" "$migration_manifest_digest" | sha256sum | awk '{print tolower($1)}')"
          {
            echo "old_sha=$BEFORE_SHA"
            echo "new_sha=$NEW_SHA"
            echo "release_id=$release_id"
            echo "migration_diff_digest=$migration_diff_digest"
            echo "migration_manifest_digest=$migration_manifest_digest"
            echo "authorization_digest=$authorization_digest"
            echo "has_migrations=$has_migrations"
          } >> "$GITHUB_OUTPUT"

  deploy-non-migration:
    needs: classify
    if: needs.classify.outputs.has_migrations == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reviewed release signer
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.classify.outputs.new_sha }}
          fetch-depth: 1

      - name: Create release-bound broker approval
        id: broker-approval
        shell: bash
        env:
          BROKER_PRIVATE_KEY: ${{ secrets.PRODUCTION_DEPLOYMENT_BROKER_PRIVATE_KEY }}
          BROKER_KEY_ID: ${{ secrets.PRODUCTION_DEPLOYMENT_BROKER_KEY_ID }}
          BROKER_APPROVED_BY: github-main-merge
          BROKER_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}-non-migration
          BROKER_REVIEWED_COMMIT: ${{ needs.classify.outputs.new_sha }}
          BROKER_SESSION_ID: ${{ needs.classify.outputs.release_id }}
          BROKER_RELEASE_ID: ${{ needs.classify.outputs.release_id }}
          BROKER_OLD_SHA: ${{ needs.classify.outputs.old_sha }}
          BROKER_NEW_SHA: ${{ needs.classify.outputs.new_sha }}
          BROKER_MIGRATION_DIFF_DIGEST: ${{ needs.classify.outputs.migration_diff_digest }}
          BROKER_MIGRATION_MANIFEST_DIGEST: ${{ needs.classify.outputs.migration_manifest_digest }}
          BROKER_AUTHORIZATION_DIGEST: ${{ needs.classify.outputs.authorization_digest }}
        run: |
          set -euo pipefail
          test -n "$BROKER_PRIVATE_KEY"
          test -n "$BROKER_KEY_ID"
          approval="$(node ops/deploy/create-rootful-broker-approval.js)"
          printf 'approval=%s\n' "$approval" >> "$GITHUB_OUTPUT"

      - name: Deploy through the reviewed immutable entrypoint
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.PRODUCTION_DEPLOYMENT_SSH_USER }}
          key: ${{ secrets.PRODUCTION_DEPLOYMENT_SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 45m
          script_stop: true
          script: |
            set -euo pipefail
            export DEPLOYMENT_CONFIG_PATH="/etc/clashcookies/production-deployment.json"
            export DEPLOYMENT_ACTIVATION_AUTHORIZED=1
            export DEPLOYMENT_ACTIVATION_DIGEST="${{ secrets.PRODUCTION_DEPLOYMENT_ACTIVATION_DIGEST }}"
            export DEPLOY_EXECUTION_AUTHORIZED=1
            export DEPLOY_RELEASE_ID="${{ needs.classify.outputs.release_id }}"
            export DEPLOY_OLD_SHA="${{ needs.classify.outputs.old_sha }}"
            export DEPLOY_NEW_SHA="${{ needs.classify.outputs.new_sha }}"
            export DEPLOY_EXPECTED_MIGRATION_DIFF_DIGEST="${{ needs.classify.outputs.migration_diff_digest }}"
            export DEPLOY_EXPECTED_MIGRATION_MANIFEST_DIGEST="${{ needs.classify.outputs.migration_manifest_digest }}"
            export DEPLOY_AUTHORIZATION_DIGEST="${{ needs.classify.outputs.authorization_digest }}"
            export DEPLOY_APPROVED_BY="github-main-merge"
            export DEPLOY_BROKER_SESSION_ID="${{ needs.classify.outputs.release_id }}"
            export DEPLOY_BROKER_APPROVAL='${{ steps.broker-approval.outputs.approval }}'
            exec /home/tilo/deploy-assets/clashcookies-production/production-deployment-entrypoint.js

  deploy-migration:
    needs: classify
    if: needs.classify.outputs.has_migrations == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production-migration
    steps:
      - name: Checkout reviewed release signer
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.classify.outputs.new_sha }}
          fetch-depth: 1

      - name: Create release-bound broker approval after migration gate
        id: broker-approval
        shell: bash
        env:
          BROKER_PRIVATE_KEY: ${{ secrets.PRODUCTION_DEPLOYMENT_BROKER_PRIVATE_KEY }}
          BROKER_KEY_ID: ${{ secrets.PRODUCTION_DEPLOYMENT_BROKER_KEY_ID }}
          BROKER_APPROVED_BY: github-environment-production-migration
          BROKER_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}-migration
          BROKER_REVIEWED_COMMIT: ${{ needs.classify.outputs.new_sha }}
          BROKER_SESSION_ID: ${{ needs.classify.outputs.release_id }}
          BROKER_RELEASE_ID: ${{ needs.classify.outputs.release_id }}
          BROKER_OLD_SHA: ${{ needs.classify.outputs.old_sha }}
          BROKER_NEW_SHA: ${{ needs.classify.outputs.new_sha }}
          BROKER_MIGRATION_DIFF_DIGEST: ${{ needs.classify.outputs.migration_diff_digest }}
          BROKER_MIGRATION_MANIFEST_DIGEST: ${{ needs.classify.outputs.migration_manifest_digest }}
          BROKER_AUTHORIZATION_DIGEST: ${{ needs.classify.outputs.authorization_digest }}
        run: |
          set -euo pipefail
          test -n "$BROKER_PRIVATE_KEY"
          test -n "$BROKER_KEY_ID"
          approval="$(node ops/deploy/create-rootful-broker-approval.js)"
          printf 'approval=%s\n' "$approval" >> "$GITHUB_OUTPUT"

      - name: Deploy approved migration release through the reviewed immutable entrypoint
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.PRODUCTION_DEPLOYMENT_SSH_USER }}
          key: ${{ secrets.PRODUCTION_DEPLOYMENT_SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 45m
          script_stop: true
          script: |
            set -euo pipefail
            export DEPLOYMENT_CONFIG_PATH="/etc/clashcookies/production-deployment.json"
            export DEPLOYMENT_ACTIVATION_AUTHORIZED=1
            export DEPLOYMENT_ACTIVATION_DIGEST="${{ secrets.PRODUCTION_DEPLOYMENT_ACTIVATION_DIGEST }}"
            export DEPLOY_EXECUTION_AUTHORIZED=1
            export DEPLOY_RELEASE_ID="${{ needs.classify.outputs.release_id }}"
            export DEPLOY_OLD_SHA="${{ needs.classify.outputs.old_sha }}"
            export DEPLOY_NEW_SHA="${{ needs.classify.outputs.new_sha }}"
            export DEPLOY_EXPECTED_MIGRATION_DIFF_DIGEST="${{ needs.classify.outputs.migration_diff_digest }}"
            export DEPLOY_EXPECTED_MIGRATION_MANIFEST_DIGEST="${{ needs.classify.outputs.migration_manifest_digest }}"
            export DEPLOY_AUTHORIZATION_DIGEST="${{ needs.classify.outputs.authorization_digest }}"
            export DEPLOY_APPROVED_BY="github-environment-production-migration"
            export DEPLOY_BROKER_SESSION_ID="${{ needs.classify.outputs.release_id }}"
            export DEPLOY_BROKER_APPROVAL='${{ steps.broker-approval.outputs.approval }}'
            exec /home/tilo/deploy-assets/clashcookies-production/production-deployment-entrypoint.js
