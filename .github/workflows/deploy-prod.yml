name: Deploy Production

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # A reviewed push/merge to main deploys through the existing SSH wrapper.
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to droplet over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          # 180 minutes exceeds the version-controlled procedure's default
          # 165-minute worst-case budget, including recovery and cleanup.
          command_timeout: 180m
          script_stop: true
          script: |
            echo "Deploying main to production"
            DEPLOY_OUTER_TIMEOUT_SECONDS=10800 ~/deploy-prod.sh
